# CI workflow.
#
# Runs on every push to main and release/* and on manual dispatch. Builds, tests,
# and packs CoreWCF, then optionally signs and publishes the packages to a NuGet feed.
#
# Feed URL resolution (in order of precedence):
#   1. workflow_dispatch input `nuget_feed_url`
#   2. repository variable `vars.NUGET_FEED_URL`
#   3. https://nuget.pkg.github.com/<repo-owner>/index.json (i.e. the GitHub
#      Packages feed of the account/org running the workflow — this is what
#      makes a private fork publish to its own private feed automatically).
#
# Auth for `dotnet nuget push`:
#   * If `secrets.NUGET_API_KEY` is set it is used (required for non-GitHub
#     feeds such as nuget.org).
#   * Otherwise the built-in `GITHUB_TOKEN` is used (works for GitHub Packages
#     in the same repository as this workflow).
#
# Publishing is gated:
#   * The pack job always runs and publishes the produced .nupkg/.snupkg files
#     as a workflow artifact (`packages-unsigned`).
#   * Signing only runs when the Azure Key Vault credentials are configured
#     (vars.SIGN_KEY_VAULT_URL, vars.SIGN_KEY_VAULT_CERTIFICATE, vars.AZURE_CLIENT_ID).
#   * Publishing to the NuGet feed only runs when *both* signing succeeded
#     (unsigned packages are NEVER pushed) AND publishing has been opted into
#     (vars.PUBLISH_PACKAGES == 'true', or workflow_dispatch input
#     `publish_packages` == 'true'). This lets a private fork developing security
#     patches build and pack without accidentally exposing fixes via the feed.
#
# SonarCloud is gated on `vars.SONAR_PROJECT_KEY`. Code coverage collection runs
# regardless of whether SonarCloud is configured.
name: CI

on:
  push:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:
    inputs:
      nuget_feed_url:
        description: 'Override NuGet feed URL for this run (defaults to vars.NUGET_FEED_URL or the repo owner''s GitHub Packages feed).'
        required: false
        default: ''
      publish_packages:
        description: 'Override package publishing for this run: ''true'' to force publish, ''false'' to force skip, blank to use vars.PUBLISH_PACKAGES.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Trigger gate. The CI workflow lives on `main` in BOTH the public
  # `CoreWCF/CoreWCF` repo and the private `CoreWCF/PrivateSecurityFixes`
  # mirror so the two `main` branches stay byte-identical. We don't want
  # every push from the upstream-sync workflow to run a full CI matrix on
  # the private mirror (it would double the cost and produce no signal that
  # the public repo's CI hasn't already produced). So this gate skips on
  # push events into the private mirror; manual `workflow_dispatch` runs
  # there are still allowed. The downstream jobs all reach this gate
  # transitively through `needs:` chains, so when it skips, the entire
  # workflow skips with zero runner minutes consumed.
  gate:
    name: Trigger gate
    runs-on: ubuntu-latest
    if: github.repository != 'CoreWCF/PrivateSecurityFixes' || github.event_name != 'push'
    steps:
      - name: Gate passed
        run: echo "CI gate passed for ${{ github.repository }} (event=${{ github.event_name }})."

  build:
    name: Build (${{ matrix.configuration }} / ${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks

      - name: Build
        uses: ./.github/actions/dotnet-build
        with:
          configuration: ${{ matrix.configuration }}
          artifact-name: build-${{ runner.os }}-${{ matrix.configuration }}

  test:
    name: Test (${{ matrix.configuration }} / ${{ matrix.os }} / ${{ matrix.tfm }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        os: [windows-latest, ubuntu-latest]
        tfm: [net8.0, net9.0, net10.0, net11.0]
        include:
          - configuration: Debug
            os: windows-latest
            tfm: net472
          - configuration: Release
            os: windows-latest
            tfm: net472
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks

      - name: Run tests
        uses: ./.github/actions/run-tests
        with:
          configuration: ${{ matrix.configuration }}
          target-framework: ${{ matrix.tfm }}
          artifact-name: build-${{ runner.os }}-${{ matrix.configuration }}
          results-suffix: ci-${{ matrix.configuration }}-${{ runner.os }}-${{ matrix.tfm }}

  test-templates:
    name: Test Templates (${{ matrix.label }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs every .NET Core variation in a single job (currently ~10 min).
          - os: ubuntu-latest
            label: ubuntu-latest
            filter: ''
          # Windows is fanned out per-TFM because running all variations in one job took
          # ~28 min. Each entry below runs ~16 variations selected by the `Framework` trait
          # set on every theory row in BasicTests.GetVariations(). Adding a new TFM is a
          # one-line change there plus one matrix entry here. .NET Framework coverage is
          # intentionally limited to net472 to match the regular build matrix above.
          - { os: windows-latest, label: windows-default, filter: Framework=default }
          - { os: windows-latest, label: windows-net10.0, filter: Framework=net10.0 }
          - { os: windows-latest, label: windows-net9.0,  filter: Framework=net9.0  }
          - { os: windows-latest, label: windows-net8.0,  filter: Framework=net8.0  }
          - { os: windows-latest, label: windows-net472,  filter: Framework=net472  }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks
        with:
          install-net11: 'false'

      - name: Download Release build
        uses: actions/download-artifact@v8
        with:
          name: build-${{ runner.os }}-Release
          path: bin

      - name: Run templates tests
        shell: pwsh
        run: ./src/CoreWCF.Templates/Run-Templates-UnitTests.ps1 -Filter '${{ matrix.filter }}'

  # Explorer coverage the `test` matrix cannot provide: neither test project matches the
  # `CoreWCF.*.Tests.csproj` glob that .github/actions/run-tests sweeps, because one needs a browser
  # and the other a Linux container runtime. Mirrors the pair in pr.yml.
  explorer-ui-tests:
    name: Explorer UI Tests (ubuntu-latest)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}

      - name: Build explorer and UI tests
        shell: bash
        run: dotnet build src/CoreWCF.Aspire.Explorer/uitests/CoreWCF.Aspire.Explorer.UITests.csproj -c Release -f net8.0

      - name: Install Chromium
        shell: pwsh
        run: bin/Release/CoreWCF.Aspire.Explorer.UITests/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run UI tests
        shell: bash
        run: |
          dotnet test src/CoreWCF.Aspire.Explorer/uitests/CoreWCF.Aspire.Explorer.UITests.csproj \
            --no-build -c Release -f net8.0 \
            --logger "trx;LogFileName=CoreWCF.Aspire.Explorer.UITests.trx" \
            --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ci-explorer-uitests
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  explorer-integration-tests:
    name: Explorer Integration Tests (ubuntu-latest)
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      extra-tags: ${{ steps.image.outputs.extra }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks

      # sha-<short> is the immutable coordinate. The moving tags are additive: `main` so a consumer
      # can follow the branch, and `latest` because that is what CoreWcfExplorerImageTags resolves by
      # default — without it, AddCoreWcfExplorer has nothing to pull. Release branches get their own
      # moving tag and deliberately do not move `latest`.
      - name: Compute image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "extra=main latest" >> "$GITHUB_OUTPUT"
          else
            # refs/heads/release/1.2 -> release-1.2
            branch="${GITHUB_REF#refs/heads/}"
            echo "extra=${branch//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build explorer container image
        uses: ./.github/actions/publish-container-image
        with:
          project: src/CoreWCF.Aspire.Explorer/src/CoreWCF.Aspire.Explorer.csproj
          repository: corewcf/aspire-explorer
          registry: ghcr.io
          image-tag: ${{ steps.image.outputs.tag }}
          additional-tags: ${{ steps.image.outputs.extra }}

      # Consumed only by the AppHost under test, never pushed, so it needs no registry prefix.
      - name: Build sample service container image
        uses: ./.github/actions/publish-container-image
        with:
          project: src/CoreWCF.Aspire.Hosting/samples/CoreWcfSampleService/CoreWcfSampleService.csproj
          repository: corewcf/sample-service
          image-tag: ${{ steps.image.outputs.tag }}

      # The support floor. Both resources are containers, because Aspire 9.x cannot reach a project
      # endpoint from a container on Linux.
      - name: Run integration tests (Aspire 9.5.2)
        shell: bash
        env:
          CoreWcfExplorer__ImageTag: ${{ steps.image.outputs.tag }}
          CoreWcfSampleService__ImageTag: ${{ steps.image.outputs.tag }}
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: 'true'
        run: |
          dotnet test src/CoreWCF.Aspire.Hosting/integrationtests/CoreWCF.Aspire.Hosting.IntegrationTests/CoreWCF.Aspire.Hosting.IntegrationTests.csproj \
            -c Release \
            --logger "trx;LogFileName=CoreWCF.Aspire.Hosting.IntegrationTests.trx" \
            --results-directory TestResults

      # The current line, and the topology consumers actually write: the CoreWCF service is a project
      # resource, reached through Aspire's container tunnel. Same assertions - the test code is shared.
      - name: Run integration tests (Aspire 13.4.6)
        shell: bash
        env:
          CoreWcfExplorer__ImageTag: ${{ steps.image.outputs.tag }}
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: 'true'
        run: |
          dotnet test src/CoreWCF.Aspire.Hosting/integrationtests/CoreWCF.Aspire.Hosting.Aspire13.IntegrationTests/CoreWCF.Aspire.Hosting.Aspire13.IntegrationTests.csproj \
            -c Release \
            --logger "trx;LogFileName=CoreWCF.Aspire.Hosting.Aspire13.IntegrationTests.trx" \
            --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ci-explorer-integration
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  publish-explorer-image:
    name: Publish Explorer Image
    needs: explorer-integration-tests
    # Same opt-in as the package publish job: never push from a fork or mirror that has not
    # explicitly asked for it. Gated on the integration tests having passed, so a broken image
    # cannot reach the registry — that image is what AddCoreWcfExplorer resolves for every consumer.
    if: >-
      github.event.inputs.publish_packages == 'true' ||
      (github.event.inputs.publish_packages != 'false' && vars.PUBLISH_PACKAGES == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilt rather than carried over from the previous job: a Docker image is not a workflow
      # artifact, and `docker save`/`load` of a ~340 MB tarball costs more than the rebuild.
      - name: Build and push explorer container image
        uses: ./.github/actions/publish-container-image
        with:
          project: src/CoreWCF.Aspire.Explorer/src/CoreWCF.Aspire.Explorer.csproj
          repository: corewcf/aspire-explorer
          registry: ghcr.io
          image-tag: ${{ needs.explorer-integration-tests.outputs.image-tag }}
          additional-tags: ${{ needs.explorer-integration-tests.outputs.extra-tags }}
          push: 'true'

  code-analysis:
    name: Code Analysis
    needs: gate
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks

      - name: Setup Java (SonarScanner)
        if: vars.SONAR_PROJECT_KEY != ''
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SonarScanner for .NET
        if: vars.SONAR_PROJECT_KEY != ''
        shell: bash
        run: dotnet tool install --tool-path . dotnet-sonarscanner

      - name: Restore
        shell: bash
        run: dotnet restore CoreWCF.sln --configfile NuGet.config

      - name: Begin SonarCloud analysis
        if: vars.SONAR_PROJECT_KEY != ''
        shell: bash
        run: |
          ./dotnet-sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /n:"CoreWCF Code Analysis" \
            /d:sonar.host.url="${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="src/Samples/**/*.*" \
            /d:sonar.coverage.exclusions="src/**/tests/**/*.cs"

      - name: Build (Release)
        shell: bash
        run: dotnet build CoreWCF.sln --no-restore -c Release

      - name: Run tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(
            find . -type f -name 'CoreWCF.*.Tests.csproj' \
              ! -name 'CoreWCF.Templates.Tests.csproj' \
              | sort
          )
          rc=0
          for proj in "${projects[@]}"; do
            echo "::group::Coverage: $proj"
            if ! dotnet test "$proj" \
                  --no-restore --no-build \
                  -c Release -f net10.0 \
                  --collect:"XPlat Code Coverage" \
                  --settings coverlet.runsettings; then
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ci
          path: '**/coverage.opencover.xml'
          if-no-files-found: ignore
          retention-days: 7

      - name: End SonarCloud analysis
        if: vars.SONAR_PROJECT_KEY != ''
        shell: bash
        run: ./dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  pack:
    name: Pack
    needs: [test, test-templates]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks

      - name: Download Release build
        uses: actions/download-artifact@v8
        with:
          name: build-Windows-Release
          path: bin

      - name: Pack
        uses: ./.github/actions/pack

  sign:
    name: Code Sign
    needs: pack
    # Gate is on a single repo VARIABLE (cert name) so the if: can evaluate it
    # before the environment is loaded. All other auth values (client/tenant/
    # subscription IDs, vault URL) are stored as repo SECRETS so they are
    # masked in workflow logs. Setting SIGN_KEY_VAULT_CERTIFICATE to a non-empty
    # value is the explicit "signing is configured for this repo" switch.
    if: vars.SIGN_KEY_VAULT_CERTIFICATE != ''
    runs-on: windows-latest
    environment: corewcf-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks
        with:
          install-net8: 'false'
          install-net9: 'false'
          install-net11: 'false'

      - name: Download unsigned packages
        uses: actions/download-artifact@v8
        with:
          name: packages-unsigned
          path: packages

      - name: Download signing config
        uses: actions/download-artifact@v8
        with:
          name: signing-config
          path: signing-config

      - name: Install sign tool
        shell: bash
        run: dotnet tool install --tool-path . sign --version 0.9.1-beta.25278.1

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign packages
        shell: pwsh
        run: |
          ./sign code azure-key-vault `
            "**/*.nupkg" `
            --base-directory "${{ github.workspace }}/packages" `
            --file-list "${{ github.workspace }}/signing-config/filelist.txt" `
            --publisher-name "CoreWCF" `
            --description "CoreWCF" `
            --description-url "https://github.com/CoreWCF/CoreWCF" `
            --azure-key-vault-certificate "${{ vars.SIGN_KEY_VAULT_CERTIFICATE }}" `
            --azure-key-vault-url "${{ secrets.SIGN_KEY_VAULT_URL }}" `
            -v Trace

      - name: Sign symbol packages
        shell: pwsh
        run: |
          ./sign code azure-key-vault `
            "**/*.snupkg" `
            --base-directory "${{ github.workspace }}/packages" `
            --file-list "${{ github.workspace }}/signing-config/filelist.txt" `
            --publisher-name "CoreWCF" `
            --description "CoreWCF" `
            --description-url "https://github.com/CoreWCF/CoreWCF" `
            --azure-key-vault-certificate "${{ vars.SIGN_KEY_VAULT_CERTIFICATE }}" `
            --azure-key-vault-url "${{ secrets.SIGN_KEY_VAULT_URL }}" `
            -v Trace

      - name: Upload signed packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-signed
          path: packages/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: [pack, sign]
    # Publish ONLY when:
    #   * pack succeeded, AND
    #   * sign succeeded (we never publish unsigned packages), AND
    #   * publishing has been opted into via the dispatch input or vars.PUBLISH_PACKAGES.
    # The opt-in keeps a private fork (e.g. for security patches) from leaking
    # packages to a feed even if signing creds happen to be configured there.
    if: >-
      always() && needs.pack.result == 'success' && needs.sign.result == 'success' &&
      (
        github.event.inputs.publish_packages == 'true' ||
        (github.event.inputs.publish_packages != 'false' && vars.PUBLISH_PACKAGES == 'true')
      )
    runs-on: ubuntu-latest
    environment: corewcf-signing
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks
        with:
          install-net8: 'false'
          install-net9: 'false'
          install-net11: 'false'

      - name: Download signed packages
        uses: actions/download-artifact@v8
        with:
          name: packages-signed
          path: packages

      - name: Compute publish feed URL
        id: feed
        shell: bash
        env:
          INPUT_URL: ${{ github.event.inputs.nuget_feed_url }}
          VAR_URL: ${{ vars.NUGET_FEED_URL }}
          DEFAULT_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: |
          url="${INPUT_URL:-${VAR_URL:-$DEFAULT_URL}}"
          if [ -z "$url" ]; then
            echo "::error::Could not determine NuGet feed URL."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Publishing to: $url"

      - name: Push packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_URL: ${{ steps.feed.outputs.url }}
        run: |
          set -euo pipefail
          api_key="${NUGET_API_KEY:-$GH_TOKEN}"
          if [ -z "$api_key" ]; then
            echo "::error::No NuGet API key available (set secrets.NUGET_API_KEY or rely on GITHUB_TOKEN)."
            exit 1
          fi
          shopt -s nullglob
          packages=( packages/*.nupkg packages/*.snupkg )
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::No .nupkg or .snupkg files found in packages/."
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --source "$FEED_URL" \
              --api-key "$api_key" \
              --skip-duplicate
          done
