trigger: none

pr:
  branches:
    include:
    - main
    - release/*
    - feature/*

variables:
  _solutions: '*.sln'
  # templates tests are ran from a dedicated stage
  _testProjects: |
    **/CoreWCF.*.Tests.csproj
    !**/CoreWCF.Templates.Tests.csproj
  # The net472 legs run this narrower list. The Aspire projects are .NET (Core) only - they build no
  # net472 output, so testing them there fails with "test source file ... was not found".
  _netFrameworkTestProjects: |
    **/CoreWCF.*.Tests.csproj
    !**/CoreWCF.Templates.Tests.csproj
    !**/CoreWCF.Aspire.*.Tests.csproj

stages:
- template: templates/BuildStage.yml
  parameters:
    solutions: $(_solutions)

- template: templates/TestStage.yml
  parameters:
    testProjects: $(_testProjects)
    netFrameworkTestProjects: $(_netFrameworkTestProjects)

- template: templates/TestTemplatesStage.yml    

- template: templates/CodeAnalysis.yml
  parameters:
    solutions: $(_solutions)
    testProjects: $(_testProjects)
